services:
  server:
    image: chat-mambo-server
    container_name: chat-mambo-server
    build:
      context: .
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    ports:
      - "8000:8000"
      - "8080:8080"
    command: ["./target/release/ChatMambo", "${SERVER_ADDRESS:-0.0.0.0:8000}"]
