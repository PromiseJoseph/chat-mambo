services:
  server:
    image: chat-mambo-server
    container_name: chat-mambo-server
    build:
      context: .
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    command: ["./target/release/ChatMambo", "0.0.0.0:${SERVER_PORT:-8000}"]
